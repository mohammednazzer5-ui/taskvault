<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskVault</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>TaskVault</h1>
    <div id="user-box" hidden>
      <span id="user-label"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button">Log out</button>
    </div>
  </header>

  <main>
    <!-- Logged-out view -->
    <section id="auth-view" class="card narrow">
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Log in</button>
        <button id="tab-register" class="tab" type="button">Sign up</button>
      </div>

      <div id="auth-error" class="alert" role="alert" hidden></div>

      <div id="login-panel">
        <label>Email <input id="login-email" type="email" autocomplete="username"></label>
        <label>Password <input id="login-password" type="password" autocomplete="current-password"></label>
        <button id="login-btn" class="btn" type="button">Log in</button>
      </div>

      <div id="register-panel" hidden>
        <label>Name <input id="reg-name" type="text" maxlength="80" autocomplete="name"></label>
        <label>Email <input id="reg-email" type="email" autocomplete="username"></label>
        <label>Password <small>(8+ characters)</small>
          <input id="reg-password" type="password" autocomplete="new-password"></label>
        <button id="register-btn" class="btn" type="button">Create account</button>
      </div>
    </section>

    <!-- Logged-in view -->
    <section id="app-view" hidden>
      <div class="card">
        <h2 id="form-title">New task</h2>
        <div id="task-error" class="alert" role="alert" hidden></div>
        <label>Title <input id="task-title" type="text" maxlength="120"></label>
        <label>Description
          <textarea id="task-desc" rows="3" maxlength="2000"></textarea></label>
        <label>Status
          <select id="task-status">
            <option value="todo">To do</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select></label>
        <div class="row">
          <button id="task-save" class="btn" type="button">Add task</button>
          <button id="task-cancel" class="btn btn-ghost" type="button" hidden>Cancel</button>
        </div>
      </div>

      <div class="card">
        <div class="row between">
          <h2>My tasks</h2>
          <select id="filter" aria-label="Filter by status">
            <option value="">All</option>
            <option value="todo">To do</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <ul id="task-list" class="list"></ul>
        <p id="empty" class="muted" hidden>No tasks yet. Add your first one above.</p>
      </div>

      <div id="admin-card" class="card" hidden>
        <h2>Admin: users</h2>
        <div id="admin-error" class="alert" role="alert" hidden></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Email</th><th>Role</th><th>Tasks</th><th></th></tr>
            </thead>
            <tbody id="user-rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
